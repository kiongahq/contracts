name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
    with:
      install: pip install -r requirements-dev.txt
